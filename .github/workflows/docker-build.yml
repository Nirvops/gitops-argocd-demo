name: Build and push
on:
  push:
    branches: [main]

permissions:
  contents: read  # Allows the workflow to read the contents of the repository
  packages: write # Allows the workflow to write to GitHub Packages (GHCR)

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # Checkout the changes in the repository 
      - name: Checkout repository
        uses: actions/checkout@v4
      # Set up Docker Buildx to enable building multi-platform images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Login to GitHub Container Registry (GHCR) using the GitHub Actions token
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build and push the Docker image to GitHub Container Registry (GHCR) with the specified tag
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./app
          file: ./app/Dockerfile
          tags: |
            ghcr.io/nirvops/gitops-argocd-demo:latest
            ghcr.io/nirvops/gitops-argocd-demo:${{ github.sha }}